# Performance measurement overlay: merge with prj.conf, without debug.conf.
# Build separately with -DEXTRA_CONF_FILE=perf.conf (for example, build_perf).
# Keep normal INFO logging; per-measurement DEBUG output changes the workload.

# Collect boot-lifetime diagnostics and log a summary every five seconds.
CONFIG_RADAR_PERF_MONITOR=y

# Enable estimator timing boundaries; aggregation and reporting are not implemented yet.
CONFIG_TIMING_FUNCTIONS=y

# Fill stacks at initialization and retain their bounds for stack-space queries.
# The performance monitor selects these too; keep their measurement cost explicit.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Measure normal execution without synthetic log bursts or consumer suspension.
CONFIG_RADAR_LOG_STRESS_TEST=n
CONFIG_RADAR_TRANSPORT_STRESS_TEST=n
