# Normal firmware configuration; debug.conf adds assertions and debug logging.

# Platform drivers and console support.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Application recovery policy and timeout values (milliseconds).
CONFIG_RADAR_RX_OVERFLOW_DRAIN=y
CONFIG_RADAR_FRAME_RX_TIMEOUT_MS=1000
CONFIG_RADAR_MEASUREMENT_TIMEOUT_MS=1000

# Inclusive gate half-widths: +/- meters and +/- whole degrees around prediction.
CONFIG_RADAR_RANGE_GATE_M=100
CONFIG_RADAR_AZIMUTH_GATE_DEG=10

# Enable Zephyr logging. Deferred mode buffers messages before formatting/output.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Let Zephyr create the worker that processes buffered log messages.
CONFIG_LOG_PROCESS_THREAD=y
# Use the console UART (ST-Link), not the USART6 protocol data link.
CONFIG_LOG_BACKEND_UART=y
# Redirect remaining printk calls through logging. They are not module-filtered.
CONFIG_LOG_PRINTK=y

# Compile application error, warning, and info logs; omit debug logs.
CONFIG_RADAR_MAIN_LOG_LEVEL_INF=y
CONFIG_RADAR_UART_RX_LOG_LEVEL_INF=y
CONFIG_RADAR_RX_PROCESSOR_LOG_LEVEL_INF=y
CONFIG_RADAR_HANDLER_LOG_LEVEL_INF=y
CONFIG_RADAR_UART_TX_LOG_LEVEL_INF=y

# Allocate 4096 bytes for log messages, separate from RX/TX queues and stacks.
# This is a starting size, not a guarantee against log loss under load.
CONFIG_LOG_BUFFER_SIZE=4096

# Do not wait for free log-buffer space in application threads.
CONFIG_LOG_BLOCK_IN_THREAD=n
# On allocation failure, drop the new log instead of evicting older logs.
# This policy affects diagnostic logs, not the UART RX overflow policy.
CONFIG_LOG_MODE_OVERFLOW=n
