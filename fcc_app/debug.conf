# Debug-only overlay: merge with prj.conf using -DEXTRA_CONF_FILE=debug.conf.
# Use a separate build directory to keep the normal build configuration unchanged.

# Enable runtime assertions for application and Zephyr code.
CONFIG_ASSERT=y

# Level 2 enables assertions without per-file preprocessor warnings.
# Assertion failures follow Zephyr's fatal-error handling by default.
CONFIG_ASSERT_LEVEL=2

# Override application INFO choices; include ERR/WRN/INF/DBG messages.
# Zephyr modules keep their own levels; printk redirection is unfiltered.
CONFIG_RADAR_MAIN_LOG_LEVEL_DBG=y
CONFIG_RADAR_UART_RX_LOG_LEVEL_DBG=y
CONFIG_RADAR_RX_PROCESSOR_LOG_LEVEL_DBG=y
CONFIG_RADAR_HANDLER_LOG_LEVEL_DBG=y
CONFIG_RADAR_UART_TX_LOG_LEVEL_DBG=y
